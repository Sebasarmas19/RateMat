<div class="space-y-4">
  <div class="relative">
    <input 
      #searchInput
      type="text" 
      [ngModel]="searchQuery"
      (ngModelChange)="onSearchChange($event)"
      placeholder="Buscar materia o profesor..."
      class="w-full pl-12 pr-10 py-4 bg-white border border-slate-200 rounded-2xl shadow-sm focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all text-slate-900 placeholder:text-slate-400 font-medium"
    >
    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M11.5 2.75C6.66751 2.75 2.75 6.66751 2.75 11.5C2.75 16.3325 6.66751 20.25 11.5 20.25C16.3325 20.25 20.25 16.3325 20.25 11.5C20.25 6.66751 16.3325 2.75 11.5 2.75ZM1.25 11.5C1.25 5.83908 5.83908 1.25 11.5 1.25C17.1609 1.25 21.75 5.83908 21.75 11.5C21.75 14.0605 20.8111 16.4017 19.2589 18.1982L22.5303 21.4697C22.8232 21.7626 22.8232 22.2374 22.5303 22.5303C22.2374 22.8232 21.7626 22.8232 21.4697 22.5303L18.1982 19.2589C16.4017 20.8111 14.0605 21.75 11.5 21.75C5.83908 21.75 1.25 17.1609 1.25 11.5Z" fill="currentColor"/></svg>
    </div>
    <button *ngIf="searchQuery" (click)="onSearchChange('')" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
  </div>

  <div *ngIf="isSearching" class="p-12 text-center text-slate-400">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto mb-3"></div>
    Buscando...
  </div>

  <div *ngIf="!isSearching && searchResults">
    
    <div *ngIf="searchResults.subjects?.length === 0 && searchResults.professors?.length === 0" class="p-12 text-center text-slate-500 bg-white rounded-2xl border border-slate-100 border-dashed">
      No encontramos nada relacionado con "{{searchQuery}}".
    </div>

    <div class="space-y-6">
      <div *ngIf="searchResults.subjects && searchResults.subjects.length > 0">
        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3 px-1">Materias</h3>
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden divide-y divide-slate-100">
          <a *ngFor="let subject of searchResults.subjects" class="block p-4 hover:bg-blue-50 transition-colors cursor-pointer group flex justify-between items-center">
            <div>
              <div class="font-semibold text-slate-800 group-hover:text-blue-700">{{subject.name}}</div>
              <div class="text-sm text-slate-500">{{subject.code}}</div>
            </div>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-slate-300 group-hover:text-blue-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </a>
        </div>
      </div>

      <div *ngIf="searchResults.professors && searchResults.professors.length > 0">
        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3 px-1">Profesores</h3>
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden divide-y divide-slate-100">
          <a *ngFor="let prof of searchResults.professors" class="block p-4 hover:bg-blue-50 transition-colors cursor-pointer group flex justify-between items-center">
            <div class="font-semibold text-slate-800 group-hover:text-blue-700">{{prof.name}}</div>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-slate-300 group-hover:text-blue-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Idle State (Before searching) -->
  <div *ngIf="!isSearching && !searchResults && searchQuery.length < 2" class="text-center p-12 text-slate-400">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 mx-auto mb-3 opacity-50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <p>Escribe al menos 2 letras para empezar a buscar.</p>
  </div>
</div>

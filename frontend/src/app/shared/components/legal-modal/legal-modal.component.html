<div *ngIf="isVisible()" class="fixed inset-0 z-[100] flex items-center justify-center p-4">
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity"></div>

  <!-- Modal content -->
  <div class="relative w-full max-w-lg bg-white rounded-2xl sm:rounded-3xl shadow-2xl p-6 sm:p-8 transform transition-all flex flex-col max-h-[90vh] border border-slate-100">
    
    <div class="mb-5 flex items-center space-x-3.5">
      <div class="w-11 h-11 bg-indigo-50 text-indigo-600 p-2.5 rounded-xl border border-indigo-100 flex items-center justify-center flex-shrink-0">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </div>
      <div>
        <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight">Políticas de la comunidad</h2>
      </div>
    </div>

    <div class="text-slate-600 mb-6 flex-1 overflow-y-auto space-y-3.5 pr-1">
      <p class="text-xs sm:text-sm text-slate-500 leading-relaxed">
        Antes de opinar, tres reglas:
      </p>

      <div class="space-y-2.5 mt-2">
        <label class="flex items-start space-x-3 p-3.5 border border-slate-200/80 rounded-xl cursor-pointer hover:bg-slate-50/80 transition-colors group">
          <input type="checkbox" [(ngModel)]="check1" class="mt-0.5 w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-0">
          <span class="text-xs text-slate-700 leading-relaxed select-none">
            <strong class="font-semibold text-slate-900 block mb-0.5">1. Responsabilidad de opinión:</strong>
            Soy el único responsable de mis valoraciones. Acepto enfocar mis aportes exclusivamente en criterios pedagógicos y docentes, absteniéndome de emitir insultos, descalificaciones personales o acusaciones delictivas.
          </span>
        </label>

        <label class="flex items-start space-x-3 p-3.5 border border-slate-200/80 rounded-xl cursor-pointer hover:bg-slate-50/80 transition-colors group">
          <input type="checkbox" [(ngModel)]="check2" class="mt-0.5 w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-0">
          <span class="text-xs text-slate-700 leading-relaxed select-none">
            <strong class="font-semibold text-slate-900 block mb-0.5">2. Identidad y trazabilidad institucional:</strong>
            Comprendo que el acceso requiere autenticación institucional UCAB. El mal uso de la plataforma o la vulneración de las normas comunitarias acarreará la suspensión permanente de mi cuenta.
          </span>
        </label>

        <label class="flex items-start space-x-3 p-3.5 border border-slate-200/80 rounded-xl cursor-pointer hover:bg-slate-50/80 transition-colors group">
          <input type="checkbox" [(ngModel)]="check3" class="mt-0.5 w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-0">
          <span class="text-xs text-slate-700 leading-relaxed select-none">
            <strong class="font-semibold text-slate-900 block mb-0.5">3. Deslinde institucional e independencia:</strong>
            Reconozco que RateMat es un proyecto estudiantil independiente y sin relación oficial con la UCAB. Las opiniones aquí emitidas pertenecen exclusivamente a sus respectivos autores.
          </span>
        </label>
      </div>
    </div>

    <div class="mt-auto pt-4 border-t border-slate-100">
      <button 
        (click)="acceptTerms()"
        [disabled]="!canAccept"
        [class.opacity-50]="!canAccept"
        [class.cursor-not-allowed]="!canAccept"
        class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl transition-all duration-200 active:scale-[0.98] shadow-lg shadow-indigo-600/20 disabled:hover:bg-indigo-600">
        Acepto
      </button>
    </div>
    
  </div>
</div>

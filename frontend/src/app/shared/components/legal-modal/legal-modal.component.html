<div *ngIf="isVisible()" class="fixed inset-0 z-[100] flex items-center justify-center p-4">
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity"></div>

  <!-- Modal content -->
  <div class="relative w-full max-w-lg bg-white rounded-3xl shadow-2xl p-6 md:p-8 transform transition-all flex flex-col max-h-[90vh]">
    
    <div class="mb-6 flex items-center space-x-3">
      <div class="bg-amber-100 text-amber-600 p-2 rounded-xl">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </div>
      <h2 class="text-2xl font-bold text-slate-900">Políticas Comunitarias</h2>
    </div>

    <div class="text-slate-600 mb-6 flex-1 overflow-y-auto space-y-4 pr-2">
      <p class="text-sm">
        Para mantener a RateMat como un espacio seguro y útil para todos, necesitamos que te comprometas a cumplir con nuestras reglas básicas antes de continuar.
      </p>

      <div class="space-y-3 mt-4">
        <label class="flex items-start space-x-3 p-3 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition-colors">
          <input type="checkbox" [(ngModel)]="check1" class="mt-1 w-5 h-5 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
          <span class="text-sm">Soy el único responsable de mis comentarios. Acepto no usar lenguaje difamatorio ni insultos hacia profesores o alumnos.</span>
        </label>

        <label class="flex items-start space-x-3 p-3 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition-colors">
          <input type="checkbox" [(ngModel)]="check2" class="mt-1 w-5 h-5 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
          <span class="text-sm">Todo archivo subido queda registrado con mi correo institucional. Subir material inapropiado (desnudos, burlas) resultará en la eliminación permanente de mi cuenta.</span>
        </label>

        <label class="flex items-start space-x-3 p-3 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition-colors">
          <input type="checkbox" [(ngModel)]="check3" class="mt-1 w-5 h-5 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
          <span class="text-sm">Solo subiré resúmenes propios, guías públicas o exámenes pasados. No subiré libros comerciales o presentaciones privadas del profesor (Copyright).</span>
        </label>
      </div>
    </div>

    <div class="mt-auto pt-4 border-t border-slate-100">
      <button 
        (click)="acceptTerms()"
        [disabled]="!canAccept"
        [class.opacity-50]="!canAccept"
        [class.cursor-not-allowed]="!canAccept"
        class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-all duration-200 active:scale-95 shadow-lg shadow-blue-600/20">
        Acepto los términos y quiero continuar
      </button>
    </div>
    
  </div>
</div>

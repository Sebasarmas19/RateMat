<div *ngIf="pwa.showInstallSheet()" class="fixed inset-0 z-[110] flex items-end sm:items-center justify-center p-0 sm:p-4 animate-backdrop-in">
  <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs cursor-pointer" (click)="close()"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="install-title"
       class="w-full sm:max-w-md max-sm:fixed max-sm:bottom-0 max-sm:inset-x-0 max-sm:rounded-b-none max-sm:rounded-t-3xl max-sm:max-h-[92dvh] bg-white sm:rounded-2xl shadow-2xl overflow-hidden border-t sm:border border-slate-200/90 z-20 relative flex flex-col animate-sheet-up sm:animate-modal-in overscroll-contain">

    <!-- Barra para cerrar en móvil -->
    <div (click)="close()" class="sm:hidden py-2.5 flex items-center justify-center cursor-pointer flex-shrink-0">
      <div class="w-12 h-1.5 bg-slate-300 rounded-full"></div>
    </div>

    <div class="overflow-y-auto px-5 sm:px-6 pb-6 sm:pt-6 space-y-5">

      <!-- Encabezado -->
      <div class="flex items-start gap-3.5">
        <img src="icons/icon-192x192.png" alt="" class="w-14 h-14 rounded-2xl shadow-sm flex-shrink-0">
        <div class="flex-1 min-w-0 pt-0.5">
          <h3 id="install-title" class="text-base font-extrabold text-slate-900">Instala RateMat</h3>
          <p class="text-xs sm:text-sm text-slate-500 leading-relaxed">Ábrela desde tu pantalla de inicio, como cualquier app. Sin App Store ni Play Store.</p>
        </div>
        <button (click)="close()" aria-label="Cerrar"
                class="max-sm:hidden -mr-2 -mt-2 min-w-[40px] min-h-[40px] rounded-xl text-slate-400 hover:text-slate-600 hover:bg-slate-100 flex items-center justify-center active:scale-90 transition-all duration-150">
          <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>

      <!-- Plataforma -->
      <div class="grid grid-cols-3 gap-1 p-1 rounded-xl bg-slate-100">
        <button *ngFor="let tab of tabs" type="button" (click)="selectedPlatform.set(tab.id)"
                class="py-2 rounded-lg text-xs font-bold active:scale-90 transition-all duration-150"
                [class.bg-white]="selectedPlatform() === tab.id"
                [class.shadow-sm]="selectedPlatform() === tab.id"
                [class.text-slate-900]="selectedPlatform() === tab.id"
                [class.text-slate-500]="selectedPlatform() !== tab.id">
          {{ tab.label }}
        </button>
      </div>

      <!-- Video del proceso -->
      <div *ngIf="videos[selectedPlatform()] as clip" class="flex justify-center">
        <div class="w-40 p-1.5 rounded-[1.75rem] bg-slate-900 shadow-lg">
          <video
            [src]="clip.src"
            [poster]="clip.poster"
            [muted]="true"
            autoplay
            loop
            playsinline
            preload="auto"
            (canplay)="playVideo($event)"
            aria-label="Cómo agregar RateMat a la pantalla de inicio"
            class="block w-full aspect-[540/1108] rounded-[1.4rem] bg-slate-800 object-cover"></video>
        </div>
      </div>

      <!-- Instalación en un toque (Chrome/Edge) -->
      <div *ngIf="canPromptHere()" class="space-y-3">
        <button type="button" (click)="install()"
                class="w-full inline-flex items-center justify-center gap-2 px-5 py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold shadow-sm active:scale-90 transition-all duration-150">
          <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>
          </svg>
          <span>Instalar ahora</span>
        </button>
        <p class="text-center text-[11px] font-semibold uppercase tracking-wider text-slate-400">o hazlo manualmente</p>
      </div>

      <!-- Pasos -->
      <ol class="space-y-2.5">
        <li *ngFor="let step of steps[selectedPlatform()]; let i = index"
            class="flex items-center gap-3 p-3 rounded-2xl bg-slate-50 border border-slate-200/70">
          <span class="w-6 h-6 rounded-full bg-slate-900 text-white text-[11px] font-black flex items-center justify-center flex-shrink-0 tabular-nums">{{ i + 1 }}</span>
          <p class="flex-1 text-xs sm:text-sm text-slate-700 leading-snug">
            {{ step.text }}
            <strong *ngIf="step.label" class="font-bold text-slate-900">"{{ step.label }}"</strong><span *ngIf="step.label">.</span>
          </p>
          <!-- Ícono tal como aparece en el navegador -->
          <span class="w-9 h-9 rounded-xl bg-white border border-slate-200 text-indigo-600 flex items-center justify-center flex-shrink-0">
            <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [ngSwitch]="step.icon">
              <g *ngSwitchCase="'share'"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></g>
              <g *ngSwitchCase="'add-square'"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 12h8"/><path d="M12 8v8"/></g>
              <g *ngSwitchCase="'more'"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></g>
              <g *ngSwitchCase="'download'"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></g>
              <g *ngSwitchCase="'monitor-down'"><path d="M12 13V7"/><path d="m15 10-3 3-3-3"/><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M12 17v4"/><path d="M8 21h8"/></g>
              <g *ngSwitchCase="'check'"><path d="M20 6 9 17l-5-5"/></g>
            </svg>
          </span>
        </li>
      </ol>

      <p class="text-[11px] text-slate-400 leading-relaxed">{{ notes[selectedPlatform()] }}</p>
    </div>
  </div>
</div>
